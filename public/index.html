<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OncoPaper Radar — 肿瘤文献雷达</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 遮罩 -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- 顶栏 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-brand">
        <span class="brand-bold">OncoPaper</span><span class="brand-light">Radar</span>
      </div>
      <div class="header-divider" aria-hidden="true"></div>
      <div class="header-info">
        <h1>肿瘤文献雷达</h1>
        <p class="subtitle">每日自动检索 · AI 评分筛选 · 个性化科研简报</p>
      </div>
      <button id="settingsBtn" class="header-settings-btn" title="设置" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 设置抽屉 -->
  <aside id="settingsDrawer" class="drawer" hidden>
    <div class="drawer-header">
      <h2>设置</h2>
      <button id="closeDrawerBtn" class="drawer-close" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- 管理员令牌 -->
      <fieldset class="form-section">
        <legend>管理员令牌</legend>
        <p class="form-hint">不设置则所有访问者都能保存配置和触发同步。</p>
        <input type="password" id="adminToken" class="input" placeholder="输入令牌...">
      </fieldset>

      <!-- 检索设置 -->
      <fieldset class="form-section">
        <legend>检索概念</legend>
        <p class="form-hint">每行一个概念，同义词用 <code>|</code> 分隔。行与行之间是 AND 关系。</p>
        <textarea id="queryGroups" class="input textarea" rows="4" placeholder="KRAS G12D | KRASG12D&#10;pancreatic cancer | PDAC"></textarea>
      </fieldset>

      <fieldset class="form-section">
        <legend>研究者画像</legend>
        <p class="form-hint">告诉 AI 你关注什么样的研究。</p>
        <textarea id="focus" class="input textarea" rows="3" placeholder="优先机制研究；关注遗传学证据、体内模型..."></textarea>
      </fieldset>

      <fieldset class="form-section">
        <legend>排除词</legend>
        <p class="form-hint">用 <code>|</code> 分隔。</p>
        <textarea id="excludeTerms" class="input textarea" rows="2" placeholder="prognostic signature | nomogram"></textarea>
      </fieldset>

      <div class="form-row">
        <fieldset class="form-section">
          <legend>最多入选</legend>
          <input type="number" id="maxArticles" class="input" min="1" max="10" value="5">
        </fieldset>
        <fieldset class="form-section">
          <legend>回看天数</legend>
          <input type="number" id="lookbackDays" class="input" min="1" max="30" value="7">
        </fieldset>
        <fieldset class="form-section form-check-wrapper">
          <label class="check-label">
            <input type="checkbox" id="excludeReviews" checked>
            <span>排除综述</span>
          </label>
        </fieldset>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="saveConfigBtn" class="btn btn-primary">保存配置</button>
      <button id="syncBtn" class="btn btn-accent">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
        立即同步
      </button>
    </div>

    <p id="drawerMessage" class="drawer-message" hidden></p>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <!-- 状态栏 -->
    <section id="statusBar" class="status-bar" hidden>
      <div class="status-top">
        <div class="status-left">
          <div class="status-tag" id="statusTag"></div>
          <span class="status-meta" id="statusMeta"></span>
        </div>
        <span class="status-date" id="statusDate"></span>
      </div>
      <div class="status-ai-note" id="statusAiNote"></div>
    </section>

    <!-- 加载 -->
    <section id="loadingView" class="center-message" hidden>
      <div class="loader"></div>
      <p id="loadingText">加载中...</p>
    </section>

    <!-- 空状态 -->
    <section id="emptyView" class="center-message">
      <div class="empty-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <h2>还没有简报</h2>
      <p>配置检索关键词后，点击同步即可发现感兴趣的论文。</p>
      <div class="empty-actions">
        <button id="emptySettingsBtn" class="btn btn-primary">开始设置</button>
        <a href="?demo=1" class="btn btn-outline">观看演示</a>
      </div>
    </section>

    <!-- 文章列表 -->
    <section id="articlesView" hidden>
      <div id="articlesList" class="articles-list"></div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
