<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OncoPaper Radar — 肿瘤文献雷达</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- 遮罩 -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- 登录弹窗 -->
  <div id="loginModal" class="modal" hidden>
    <div class="modal-card">
      <h3>管理员登录</h3>
      <p class="modal-hint">输入令牌以保存配置和触发同步。</p>
      <input type="password" id="loginTokenInput" class="input" placeholder="输入管理员令牌...">
      <div class="modal-actions">
        <button id="loginCancelBtn" class="btn btn-outline">取消</button>
        <button id="loginConfirmBtn" class="btn btn-primary">登录</button>
      </div>
      <p id="loginMsg" class="drawer-message" hidden></p>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-brand">
        <span class="brand-bold">YDchen</span><span class="brand-light">Tools</span>
      </div>
      <div class="header-divider" aria-hidden="true"></div>
      <div class="header-info">
        <h1>肿瘤文献雷达</h1>
        <p class="subtitle">每日自动检索 · AI 评分筛选 · 个性化科研简报</p>
      </div>
      <div class="header-actions">
        <button id="loginBtn" class="header-btn" title="管理员登录" aria-label="登录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </button>
        <button id="logoutBtn" class="header-btn" title="退出登录" aria-label="退出" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
        <button id="settingsBtn" class="header-btn" title="设置" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 设置抽屉 -->
  <aside id="settingsDrawer" class="drawer" hidden>
    <div class="drawer-header">
      <h2>设置</h2>
      <button id="closeDrawerBtn" class="drawer-close" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- 研究者画像 (最上面) -->
      <fieldset class="form-section">
        <legend>🎯 研究者画像</legend>
        <p class="form-hint">告诉 AI 你关注什么样的研究，它会影响每篇论文的评分倾向。</p>
        <textarea id="focus" class="input textarea" rows="4" placeholder="优先机制研究；关注遗传学证据、体内模型..."></textarea>
      </fieldset>

      <!-- 检索概念 -->
      <fieldset class="form-section">
        <legend>🔍 检索概念</legend>
        <p class="form-hint">每行一个概念，同义词用 <code>|</code> 分隔。行与行之间是 AND 关系。</p>
        <textarea id="queryGroups" class="input textarea" rows="4" placeholder="KRAS G12D | KRASG12D&#10;pancreatic cancer | PDAC"></textarea>
      </fieldset>

      <!-- 排除词 -->
      <fieldset class="form-section">
        <legend>🚫 排除词</legend>
        <p class="form-hint">用 <code>|</code> 分隔。</p>
        <textarea id="excludeTerms" class="input textarea" rows="2" placeholder="prognostic signature | nomogram"></textarea>
      </fieldset>

      <div class="form-row">
        <fieldset class="form-section">
          <legend>最多入选</legend>
          <input type="number" id="maxArticles" class="input" min="1" max="10" value="5">
        </fieldset>
        <fieldset class="form-section">
          <legend>回看天数</legend>
          <input type="number" id="lookbackDays" class="input" min="1" max="30" value="7">
        </fieldset>
        <fieldset class="form-section form-check-wrapper">
          <label class="check-label">
            <input type="checkbox" id="excludeReviews" checked>
            <span>排除综述</span>
          </label>
        </fieldset>
      </div>

      <!-- 未登录提示 -->
      <div id="drawerLoginPrompt" class="drawer-login-prompt">
        <p>⚠️ 未登录：只能查看设置，不能保存或同步。</p>
        <button id="drawerLoginBtn" class="btn btn-outline">去登录</button>
      </div>
    </div>

    <div class="drawer-footer">
      <button id="saveConfigBtn" class="btn btn-primary" disabled>保存配置</button>
      <button id="syncBtn" class="btn btn-accent" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3v6h-6"/></svg>
        立即同步
      </button>
    </div>

    <p id="drawerMessage" class="drawer-message" hidden></p>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <!-- 状态栏 -->
    <section id="statusBar" class="status-bar" hidden>
      <div class="status-top">
        <div class="status-left">
          <div class="status-tag" id="statusTag"></div>
          <span class="status-meta" id="statusMeta"></span>
        </div>
        <span class="status-date" id="statusDate"></span>
      </div>
      <div class="status-ai-note" id="statusAiNote"></div>
    </section>

    <!-- 加载 -->
    <section id="loadingView" class="center-message" hidden>
      <div class="loader"></div>
      <p id="loadingText">加载中...</p>
    </section>

    <!-- 空状态 -->
    <section id="emptyView" class="center-message">
      <div class="empty-icon">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <h2>还没有简报</h2>
      <p>配置检索关键词后，点击同步即可发现感兴趣的论文。</p>
      <div class="empty-actions">
        <button id="emptySettingsBtn" class="btn btn-primary">开始设置</button>
        <a href="?demo=1" class="btn btn-outline">观看演示</a>
      </div>
    </section>

    <!-- 文章列表 -->
    <section id="articlesView" hidden>
      <div id="articlesList" class="articles-list"></div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
